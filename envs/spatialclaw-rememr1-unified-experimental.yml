name: spatialclaw-rememr1-unified
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - nodejs
  - ninja
  - cuda-version=12.8
  - cuda-nvcc=12.8
  - cuda-cudart=12.8
  - cuda-cudart-dev=12.8
  - pip:
      # This is an integration-oriented compromise environment:
      # - good target for "SpatialClaw bot/memory + ReMemR1 operator service/client"
      # - NOT the recommended target for full SpatialClaw method coverage
      # - intentionally avoids SpatialClaw root requirements.txt because it pins
      #   a separate torch lane that conflicts with the working vllm stack
      #
      # Usage:
      #   cd /dugaoyuan/AgentAndClaw/Claws/SpatialClaw-pri
      #   conda env create -f envs/spatialclaw-rememr1-unified-experimental.yml
      - -e .[memory,interactive]
      - -r bot/requirements.txt
      - aiohttp==3.13.5
      - beautifulsoup4==4.14.3
      - datasets==4.8.4
      - fire==0.7.1
      - fastapi==0.135.2
      - html2text==2025.4.15
      - httpx==0.28.1
      - hydra-core==1.3.2
      - nltk==3.9.4
      - openai==2.24.0
      - pyyaml==6.0.3
      - pyzmq==27.1.0
      - ray==2.44.1
      - safetensors==0.7.0
      - sentencepiece==0.2.1
      - tensordict==0.6.2
      - tenacity==9.1.4
      - torch==2.10.0
      - torchaudio==2.10.0
      - torchdata==0.11.0
      - torchvision==0.25.0
      - transformers==4.57.6
      - uvicorn==0.42.0
      - vllm==0.18.0
      - wandb==0.26.0
      - wonderwords==3.0.1
      - accelerate>=1.0,<2.0
