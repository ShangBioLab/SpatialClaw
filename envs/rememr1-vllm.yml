name: rememr1-vllm
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ninja
  - cuda-version=12.8
  - cuda-nvcc=12.8
  - cuda-cudart=12.8
  - cuda-cudart-dev=12.8
  - pip:
      # ReMemR1 runtime code is now vendored under
      # spatialclaw/agents/mar; this file captures the external vllm
      # environment while checkpoints still live outside the repo.
      - aiohttp==3.13.5
      - beautifulsoup4==4.14.3
      - datasets==4.8.4
      - fire==0.7.1
      - flash-attn==2.8.3
      - fastapi==0.135.2
      - html2text==2025.4.15
      - httpx==0.28.1
      - hydra-core==1.3.2
      - nltk==3.9.4
      - openai==2.24.0
      - pyyaml==6.0.3
      - pyzmq==27.1.0
      - ray==2.44.1
      - safetensors==0.7.0
      - sentencepiece==0.2.1
      - tensordict==0.6.2
      - tenacity==9.1.4
      - torch==2.10.0
      - torchaudio==2.10.0
      - torchdata==0.11.0
      - torchvision==0.25.0
      - transformers==4.57.6
      - uvicorn==0.42.0
      - vllm==0.18.0
      - wandb==0.26.0
      - wonderwords==3.0.1
      # ReMemR1 training code has fallback paths when accelerate is absent,
      # but for future PPO / checkpoint workflows it should be present.
      - accelerate>=1.0,<2.0
